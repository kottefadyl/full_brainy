services:
  mongodb:
    image: mongo:9
    container_name: brainy_mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: ./api
    restart: unless-stopped
    command: sh -c "npm install --no-audit --no-fund && npm run start:dev"
    depends_on:
      - mongodb
      - s3
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-brainy-local-development-secret-change-before-deploying}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-brainy-6d65c}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-true}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      MONGODB_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-password}@mongodb:27017/brainy?authSource=admin
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
      WATCHPACK_POLLING: "true"
      # T44 — S3-compatible storage for large files (VersityGW locally).
      S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:7070}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-brainy-large-files}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-brainy-local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-brainy-local-secret-change-me}
    volumes:
      - ./api:/app
      - api_node_modules:/app/node_modules

  # T44 — local S3-compatible storage (VersityGW, posix backend). MinIO community images are no longer published.
  s3:
    image: versity/versitygw:v1.10.0
    container_name: brainy_s3
    restart: unless-stopped
    command: posix /data
    ports:
      - "127.0.0.1:9000:7070"
    environment:
      ROOT_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-brainy-local}
      ROOT_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-brainy-local-secret-change-me}
      VGW_REGION: ${S3_REGION:-us-east-1}
    volumes:
      - s3_data:/data

  mongo-express:
    image: mongo-express:1
    container_name: brainy_mongo_express
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD:-password}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-password}

volumes:
  mongo_data:
  s3_data:
  api_node_modules:
